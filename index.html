      <div style="max-width:760px;margin:0 auto;padding:40px 24px;font-family:system-ui,sans-serif;line-height:1.6;color:#0A1220">
        <h1 style="font-size:32px;line-height:1.15;margin:0 0 12px">Water refill in Fremont &amp; Newark</h1>
        <p style="font-size:17px;color:#454b56">Le Water Store is a family-owned water store, open since 1998,
        with three refill locations across Fremont and Newark, California. Bring any clean
        container and we refill it at the counter with purified reverse-osmosis or
        mineral-rich alkaline drinking water.</p>

        <h2 style="font-size:20px;margin:28px 0 8px">Price per gallon</h2>
        <table style="border-collapse:collapse;width:100%;max-width:460px">
          <tr><th align="left" style="padding:6px 0">Water</th><th align="left">Walk-in</th><th align="left">Member</th></tr>
          <tr><td style="padding:6px 0">Purified (reverse osmosis)</td><td>$0.50</td><td>$0.375</td></tr>
          <tr><td style="padding:6px 0">Alkaline</td><td>$1.30</td><td>$0.90</td></tr>
        </table>
        <p style="font-size:15px;color:#454b56">Member pricing comes from a prepaid plan: 120 gallons of
        purified for $45, or 100 gallons of alkaline for $90. Your balance follows your
        phone number to any of our three stores.</p>

        <h2 style="font-size:20px;margin:28px 0 8px">Our three stores</h2>
        <ul style="padding-left:18px">
          <li style="margin-bottom:10px"><a href="/fremont-north"><strong>North Fremont</strong></a> &mdash;
            35762 Fremont Blvd, Fremont, CA 94536. <a href="tel:+15107425699">(510) 742-5699</a>. Open daily 10am to 7pm.</li>
          <li style="margin-bottom:10px"><a href="/fremont-central"><strong>Central Fremont</strong></a> &mdash;
            39409 Fremont Blvd, Fremont, CA 94538. <a href="tel:+15106561533">(510) 656-1533</a>. Open daily 10am to 7pm.</li>
          <li style="margin-bottom:10px"><a href="/newark"><strong>Newark</strong></a> &mdash;
            39131 Cedar Blvd, Newark, CA 94560. <a href="tel:+15107396225">(510) 739-6225</a>. Open daily 10am to 6:30pm.</li>
        </ul>
        <p style="font-size:15px;color:#454b56">Every location also has a self-serve water vending machine outside,
        available 24 hours a day even when the store is closed. The machines take cash.</p>
