                            "@type": "Answer",

                      "@type": "Question",
                      "name": "How much does a water refill cost?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Purified water is $0.50 a gallon, or $0.375 a gallon on a prepaid plan. Alkaline water is $1.30 a gallon, or $0.90 a gallon prepaid. Bring any container and we fill it at the counter."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Is there a membership or prepaid plan?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Yes. A prepaid plan is 120 gallons of purified water for $45, or 100 gallons of alkaline for $90. That works out to $0.375 a gallon purified and $0.90 a gallon alkaline, so members save over 25 percent against walk-in pricing. There is no card to carry: the balance follows your phone number and can be spent at any of our three stores."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Can I get water when the store is closed?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Yes. Every location has a self-serve water vending machine outside, available 24 hours a day even when the store is closed. The machines take cash."
                      }
                },
                {
                      "@type": "Question",
                      "name": "How do I check my prepaid gallon balance?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Check it on lewaterstore.com. Enter your phone number in the balance checker on the homepage and your remaining gallons come back on the spot, with no account or app needed. The balance follows your phone number to any of our three stores."
                      }
                },
                {
                      "@type": "Question",
                      "name": "Where are your water stores located?",
                      "acceptedAnswer": {
                            "@type": "Answer",
                            "text": "Three Le Water Store locations: 35762 Fremont Blvd, Fremont; 39409 Fremont Blvd, Fremont; and 39131 Cedar Blvd, Newark. The Fremont stores are open 10am to 7pm daily and Newark is open 10am to 6:30pm daily."
